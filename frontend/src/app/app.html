@if (isAuthenticated()) {
  <mat-toolbar color="primary" class="app-toolbar">
    <a routerLink="/" class="brand">
      <mat-icon>shield</mat-icon>
      <span class="title">{{ title }}</span>
    </a>

    <nav class="nav-links">
      <a mat-button routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <mat-icon>dashboard</mat-icon>
        Dashboard
      </a>
      <a mat-button routerLink="/clients" routerLinkActive="active">
        <mat-icon>people</mat-icon>
        Clients
      </a>
      <a mat-button routerLink="/contrats" routerLinkActive="active">
        <mat-icon>description</mat-icon>
        Contrats
      </a>
      <a mat-button routerLink="/paiements" routerLinkActive="active">
        <mat-icon>payments</mat-icon>
        Paiements
      </a>
    </nav>

    <span class="spacer"></span>

    <button mat-button [matMenuTriggerFor]="userMenu" class="user-button">
      <mat-icon>account_circle</mat-icon>
      <span class="username">{{ username() }}</span>
      <mat-icon>arrow_drop_down</mat-icon>
    </button>

    <mat-menu #userMenu="matMenu">
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Se déconnecter</span>
      </button>
    </mat-menu>
  </mat-toolbar>
}

<main class="app-content" [class.full-height]="!isAuthenticated()">
  <router-outlet />
</main>
