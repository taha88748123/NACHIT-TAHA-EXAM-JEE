<div class="login-page">
  <mat-card class="login-card">
    <mat-card-header class="login-header">
      <div mat-card-avatar class="login-avatar">
        <mat-icon>shield</mat-icon>
      </div>
      <mat-card-title>Connexion</mat-card-title>
      <mat-card-subtitle>Assurance App</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
        <mat-form-field appearance="outline">
          <mat-label>Nom d'utilisateur</mat-label>
          <input matInput formControlName="username" autocomplete="username">
          <mat-icon matSuffix>person</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Mot de passe</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password">
          <mat-icon matSuffix>lock</mat-icon>
        </mat-form-field>

        @if (errorMessage()) {
          <div class="error-banner">
            <mat-icon>error_outline</mat-icon>
            <span>{{ errorMessage() }}</span>
          </div>
        }

        <button mat-flat-button color="primary" type="submit"
                [disabled]="form.invalid || loading()" class="login-button">
          @if (loading()) {
            <mat-spinner diameter="22"></mat-spinner>
          } @else {
            <span>Se connecter</span>
          }
        </button>
      </form>

      <div class="login-hints">
        <strong>Comptes de test :</strong>
        <ul>
          <li><code>admin / admin123</code></li>
          <li><code>employe / employe123</code></li>
          <li><code>client / client123</code></li>
        </ul>
      </div>
    </mat-card-content>
  </mat-card>
</div>
