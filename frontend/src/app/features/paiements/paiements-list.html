<div class="header">
  <div>
    <h1>Paiements</h1>
    <p class="subtitle">{{ paiements().length }} paiement(s) au total</p>
  </div>
  <button mat-flat-button color="primary" (click)="openCreate()">
    <mat-icon>add</mat-icon>
    Nouveau paiement
  </button>
</div>

<mat-card class="table-card">
  <table mat-table [dataSource]="paiements()" class="full-width">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let p">{{ p.id }}</td>
    </ng-container>

    <ng-container matColumnDef="contratId">
      <th mat-header-cell *matHeaderCellDef>Contrat #</th>
      <td mat-cell *matCellDef="let p">{{ p.contratId }}</td>
    </ng-container>

    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef>Date</th>
      <td mat-cell *matCellDef="let p">{{ p.date }}</td>
    </ng-container>

    <ng-container matColumnDef="montant">
      <th mat-header-cell *matHeaderCellDef>Montant</th>
      <td mat-cell *matCellDef="let p">{{ p.montant }} MAD</td>
    </ng-container>

    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef>Type</th>
      <td mat-cell *matCellDef="let p">{{ p.type }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="actions-col">Actions</th>
      <td mat-cell *matCellDef="let p" class="actions-col">
        <button mat-icon-button color="warn" (click)="delete(p)" title="Supprimer">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  @if (paiements().length === 0 && !loading()) {
    <div class="empty">Aucun paiement à afficher.</div>
  }
</mat-card>
